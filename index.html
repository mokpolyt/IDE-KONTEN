<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Content Ideas</title>
<style>
:root{--bg:#090d12;--panel:#111820;--panel2:#151e27;--line:#26323d;--text:#f4f7fa;--muted:#84919d;--cyan:#42d7e8;--pink:#ff5d91;--orange:#ff936f;--green:#7ee2ad;--shadow:0 22px 60px rgba(0,0,0,.35)}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0%,#182733 0,#090d12 38%,#070a0e 100%);font-family:Inter,Segoe UI,Arial,sans-serif;color:var(--text);padding:28px}.app{max-width:1550px;margin:auto}.top{display:flex;justify-content:space-between;align-items:flex-end;gap:25px;margin-bottom:20px}.eyebrow{font-size:11px;font-weight:900;letter-spacing:.2em;text-transform:uppercase;color:var(--cyan);margin-bottom:8px}.title{font-size:38px;font-weight:950;letter-spacing:-.05em}.sub{color:var(--muted);font-size:13px;margin-top:7px}.badge{background:#121a22;border:1px solid var(--line);padding:10px 14px;border-radius:999px;font-size:11px;font-weight:900;color:#aebbc4;box-shadow:0 8px 25px rgba(0,0,0,.2)}.layout{display:grid;grid-template-columns:235px minmax(0,1fr);gap:18px;align-items:start}.sidebar{background:rgba(15,22,29,.9);border:1px solid var(--line);border-radius:24px;padding:12px;box-shadow:var(--shadow);position:sticky;top:20px}.side-title{padding:10px 10px 13px;font-size:11px;font-weight:900;letter-spacing:.14em;color:#73818c;text-transform:uppercase}.project-tab{width:100%;border:0;background:transparent;display:flex;align-items:center;gap:9px;padding:11px 10px;border-radius:14px;cursor:pointer;margin:3px 0;color:#a8bac5;font-weight:850;text-align:left;transition:.18s}.project-tab:hover{background:#17232d;transform:translateX(2px)}.project-tab.active{background:linear-gradient(100deg,#142b35,#24262b);color:#fff;box-shadow:inset 0 0 0 1px rgba(66,215,232,.16)}.project-dot{width:9px;height:9px;border-radius:50%;background:#46545f;flex:none}.project-tab.active .project-dot{background:linear-gradient(135deg,var(--cyan),var(--pink))}.tab-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.main{background:rgba(15,22,29,.96);border:1px solid var(--line);border-radius:26px;box-shadow:var(--shadow);overflow:hidden}.project-head{display:flex;justify-content:space-between;align-items:center;padding:21px 24px;border-bottom:1px solid var(--line);gap:20px}.head-left{display:flex;align-items:center;gap:12px}.name-input{border:1px solid #30404c;outline:0;background:#151e27;color:#fff;border-radius:999px;padding:10px 16px;font-size:18px;font-weight:900;min-width:190px}.name-input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(66,215,232,.08)}.rename-note{font-size:11px;color:#687782}.project-count{font-size:11px;font-weight:900;color:#697984;letter-spacing:.12em}.table-wrap{padding:0 18px 20px;overflow-x:auto}.table{min-width:1100px}.thead,.row{display:grid;grid-template-columns:1.1fr 2.25fr .9fr 1.05fr 1.1fr;gap:12px}.thead{padding:17px 7px 10px}.th{font-size:11px;font-weight:900;letter-spacing:.14em;color:#71818c;text-transform:uppercase}.row{align-items:stretch;margin:7px 0}.cell{min-height:150px;border:1px solid var(--line);border-radius:17px;background:linear-gradient(145deg,#121a22,#0f161d);display:flex;align-items:center;justify-content:center}.image-cell{padding:8px;gap:8px;position:relative}.image-box{height:112px;width:150px;border-radius:12px;border:1px dashed #34434f;background:linear-gradient(135deg,#17212a,#0e141a);display:flex;align-items:center;justify-content:center;overflow:hidden}.image-box img{width:100%;height:100%;object-fit:cover;display:none}.placeholder{font-size:10px;color:#687883;font-weight:800;text-align:center}.image-actions{display:flex;flex-direction:column;gap:6px}.browse,.edit{border:0;border-radius:10px;padding:8px 11px;background:linear-gradient(100deg,var(--pink),var(--orange));color:#fff;font-weight:900;font-size:10px;cursor:pointer}.row-no{font-size:10px;font-weight:900;color:#4f5d67;position:absolute;left:10px;top:9px}.content-cell{padding:10px;align-items:stretch}.content-area{width:100%;height:128px;resize:vertical;min-height:90px;border:1px solid #2b3944;border-radius:12px;background:#0c1218;color:#e9eef2;outline:0;padding:12px;font:500 13px/1.45 Inter,Segoe UI,Arial,sans-serif}.content-area::placeholder{color:#586772}.content-area:focus,.link-input:focus,.draft-input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(66,215,232,.07)}.metric-cell{flex-direction:column;gap:9px;padding:12px;position:relative}.metric{font-size:20px;font-weight:950;letter-spacing:-.03em;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.metric.zero{color:#6d7b84}.draft-input,.link-input{width:100%;border:1px solid #2b3944;border-radius:11px;background:#0c1218;color:#edf2f5;outline:0;padding:10px;font:700 12px Inter,Segoe UI,Arial,sans-serif}.upload-select{width:100%;border:1px solid #2b3944;border-radius:11px;background:#0c1218;color:#e9eef2;outline:0;padding:10px;font:800 12px Inter,Segoe UI,Arial,sans-serif}.save-mini{margin-top:2px}.status{position:fixed;left:50%;bottom:22px;transform:translate(-50%,12px);background:#e9f8fa;color:#091116;padding:10px 17px;border-radius:999px;font-size:12px;font-weight:900;opacity:0;pointer-events:none;transition:.2s;z-index:50}.status.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:900px){body{padding:16px}.top{align-items:flex-start;flex-direction:column}.layout{grid-template-columns:1fr}.sidebar{position:static;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}.side-title{grid-column:1/-1}.project-tab{justify-content:center}.tab-name{max-width:100px}.main{border-radius:20px}.project-head{padding:17px}.rename-note{display:none}}
@media(max-width:520px){.sidebar{grid-template-columns:repeat(2,1fr)}.title{font-size:30px}.name-input{min-width:140px;width:100%}.project-head{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<div class="app">
  <div class="top"><div><div class="eyebrow">Content Workspace</div><div class="title">Content Ideas</div><div class="sub">Pilih proyek di kiri. Setiap proyek memiliki 5 ide konten yang sepenuhnya terpisah.</div></div><div class="badge">8 PROJECTS · 5 ROWS / PROJECT</div></div>
  <div class="layout"><aside class="sidebar"><div class="side-title">Projects</div><div id="tabs"></div></aside><main class="main"><div class="project-head"><div class="head-left"><input id="projectName" class="name-input"><span class="rename-note">klik nama untuk rename</span></div><div id="projectCount" class="project-count"></div></div><div class="table-wrap"><div class="table"><div class="thead"><div class="th">GAMBAR</div><div class="th">CONTENT IDEA</div><div class="th">DRAFT</div><div class="th">SUDAH UPLOAD?</div><div class="th">EXT LINK</div></div><div id="rows"></div></div></div></main></div>
</div><div id="status" class="status"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://gjyeknwtoofpuvoaftfj.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_HBf14rn-fWP8AZ_OaLFfag_V6qNKjk5";
const supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const TRACKER_ID=1;
const STORAGE_BUCKET="content-ideas-images";
const defaultProjects=Array.from({length:8},(_,p)=>({name:`PROYEK ${String.fromCharCode(65+p)}`,rows:Array.from({length:5},()=>({image:'',idea:'',draft:'Belum',uploaded:'Belum',link:''}))}));
let projects=structuredClone(defaultProjects),active=0;
function showStatus(msg){const s=document.getElementById('status');s.textContent=msg;s.classList.add('show');clearTimeout(showStatus.t);showStatus.t=setTimeout(()=>s.classList.remove('show'),1600)}
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function renderTabs(){const box=document.getElementById('tabs');box.innerHTML='';projects.forEach((p,i)=>{const b=document.createElement('button');b.className='project-tab'+(i===active?' active':'');b.innerHTML=`<span class="project-dot"></span><span class="tab-name">${esc(p.name)}</span>`;b.onclick=()=>{active=i;render()};box.appendChild(b)})}
function render(){renderTabs();const p=projects[active];document.getElementById('projectName').value=p.name;document.getElementById('projectCount').textContent=`PROJECT ${String(active+1).padStart(2,'0')} · 5 ROWS`;const rows=document.getElementById('rows');rows.innerHTML='';p.rows.forEach((r,i)=>{const el=document.createElement('div');el.className='row';el.innerHTML=`<div class="cell image-cell"><div class="row-no">#${i+1}</div><div class="image-box"><img><span class="placeholder">UPLOAD GAMBAR</span></div><div class="image-actions"><input class="file" type="file" accept="image/*" hidden><button class="browse">BROWSE</button></div></div><div class="cell content-cell"><textarea class="content-area" placeholder="Tulis ide konten di sini... (bisa panjang, sampai ±1000 kata)"></textarea></div><div class="cell metric-cell"><input class="draft-input" placeholder="Status draft"><button class="edit save-mini">SAVE</button></div><div class="cell metric-cell"><select class="upload-select"><option value="Belum">Belum</option><option value="Sudah">Sudah</option></select><button class="edit save-upload">SAVE</button></div><div class="cell metric-cell"><input class="link-input" placeholder="https://..."><button class="edit save-link">SAVE</button></div>`;rows.appendChild(el);wireRow(el,r,i)});}
async function saveProjects(msg='Tersimpan'){const {error}=await supabaseClient.from('tracker').update({content_ideas_data:projects}).eq('id',TRACKER_ID);if(error){console.error(error);showStatus('Gagal menyimpan');alert('Gagal menyimpan ke Supabase.\n\n'+error.message);return false}showStatus(msg);return true}
function wireRow(el,r,i){const img=el.querySelector('img'),ph=el.querySelector('.placeholder'),file=el.querySelector('.file'),browse=el.querySelector('.browse');const idea=el.querySelector('.content-area'),draft=el.querySelector('.draft-input'),uploaded=el.querySelector('.upload-select'),link=el.querySelector('.link-input');idea.value=r.idea||'';draft.value=r.draft||'Belum';uploaded.value=r.uploaded||'Belum';link.value=r.link||'';if(r.image){img.src=r.image;img.style.display='block';ph.style.display='none'}browse.onclick=()=>file.click();file.onchange=async()=>{const f=file.files[0];if(!f)return;if(f.size>10*1024*1024){alert('Gunakan gambar di bawah 10 MB.');return}browse.disabled=true;browse.textContent='UPLOAD...';showStatus('Mengupload gambar...');try{const ext=(f.name.split('.').pop()||'jpg').toLowerCase();const path=`project-${active+1}/row-${i+1}-${Date.now()}.${ext}`;const {error:upErr}=await supabaseClient.storage.from(STORAGE_BUCKET).upload(path,f,{cacheControl:'3600',upsert:false});if(upErr)throw upErr;const {data:urlData}=supabaseClient.storage.from(STORAGE_BUCKET).getPublicUrl(path);r.image=urlData.publicUrl;img.src=r.image;img.style.display='block';ph.style.display='none';await saveProjects('Gambar tersimpan')}catch(error){console.error(error);alert('Upload gagal.\n\n'+error.message);showStatus('Upload gagal')}finally{browse.disabled=false;browse.textContent='BROWSE'}};el.querySelector('.save-mini').onclick=async()=>{r.idea=idea.value;r.draft=draft.value.trim()||'Belum';await saveProjects()};el.querySelector('.save-upload').onclick=async()=>{r.uploaded=uploaded.value;await saveProjects()};el.querySelector('.save-link').onclick=async()=>{r.link=link.value.trim();await saveProjects()};idea.addEventListener('blur',async()=>{if(idea.value!==r.idea){r.idea=idea.value;await saveProjects('Ide tersimpan')}})}
document.getElementById('projectName').addEventListener('change',async e=>{projects[active].name=e.target.value.trim()||`PROYEK ${String.fromCharCode(65+active)}`;e.target.value=projects[active].name;renderTabs();await saveProjects('Nama proyek tersimpan')});
async function loadProjects(){showStatus('Loading...');try{const {data,error}=await supabaseClient.from('tracker').select('content_ideas_data').eq('id',TRACKER_ID).single();if(error)throw error;if(data&&Array.isArray(data.content_ideas_data)&&data.content_ideas_data.length===8){projects=data.content_ideas_data;render();showStatus('Data loaded');return}projects=structuredClone(defaultProjects);render();await saveProjects('Data awal tersimpan')}catch(error){console.error(error);render();showStatus('Gagal memuat');alert('Tidak bisa membaca data Supabase.\n\n'+error.message)}}
loadProjects();
</script>
</body></html>
